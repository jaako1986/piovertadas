{% extends "base.html" %}
{% block title %}Galería — PIOVERTADAS{% endblock %}
{% block content %}
<section class="section container">
  <h1>Galería</h1>
  {% if fotos %}
    <div class="gallery">
      {% for ruta in fotos %}
       <a class="g-item" href="{{ url_for('static', filename=ruta) }}" target="_blank">
  <img loading="lazy"
       src="{{ url_for('static', filename=ruta) }}"
       alt="Foto {{ loop.index }}">
</a>
      {% endfor %}
    </div>
  {% else %}
    <p>No hay fotos todavía. Subí archivos a <code>static/fotos</code>.</p>
  {% endif %}
</section>
{% endblock %}
