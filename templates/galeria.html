{% extends "base.html" %}
{% block title %}Galería — PIOVERTADAS{% endblock %}
{% block content %}
<section class="section container">
  <h1>Galería</h1>
  {% if fotos %}
    <div class="gallery">
      {% for ruta in fotos %}
        <figure class="g-item">
          <img loading="lazy"
               src="{{ url_for('static', filename=ruta) }}"
               alt="Foto {{ loop.index }}"
               width="1200" height="800" />
        </figure>
      {% endfor %}
    </div>
  {% else %}
    <p>No hay fotos todavía. Subí archivos a <code>static/fotos</code>.</p>
  {% endif %}
</section>
{% endblock %}
