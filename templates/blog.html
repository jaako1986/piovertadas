
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Bitácora Scout</title>
 <link rel="stylesheet" href="{{ url_for('static', filename='css/home_v2.css') }}">
</head>
<body>
<header class="site-header">
  <div class="container">
    
    <div class="brand">
      <img src="{{ url_for('static', filename='backgrounds/escudo.png') }}" class="brand-logo">
      <span class="brand-text">PIOVERTADAS</span>
    </div>

    <img src="{{ url_for('static', filename='backgrounds/logopromesa.png') }}" class="brand-logo">

  </div>
</header>
<h2>📘 Bitácora Scout</h2>
<div class="blog-contenedor">
  {% for e in entradas %}
    <article class="entrada-blog">
      <h3>{{ e.titulo }}</h3>
      <small>{{ e.fecha }}</small>
      <div class="contenido">
        {{ e.contenido }}
      </div>
    </article>
  {% endfor %}
</div>
</body>
</html>
