{% extends "base.html" %}
{% block title %}Agregar grupo — GSA Islas Malvinas{% endblock %}
{% block content %}
<style>
.group-form-card{
  max-width: 560px;
  margin: 3rem auto;
  padding: 1.25rem;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px;
  background: rgba(255,255,255,.04);
}
.group-form-card h1{ margin-top: 0; }
.group-form{
  display: grid;
  gap: .75rem;
}
.form-back{ margin-top: 1rem; }
</style>

<section class="section container">
  <div class="group-form-card">
    <h1>Agregar grupo</h1>
    <form class="group-form" method="post">
      <input name="nombre" placeholder="Nombre" required>
      <input name="ciudad" placeholder="Ciudad" required>
      <input name="provincia" placeholder="Provincia" required>
      <input name="contacto" placeholder="Contacto (opcional)">
      <button class="btn" type="submit">Guardar</button>
    </form>
    <p class="form-back">
      <a href="{{ url_for('ver_grupos') }}">Volver a la lista</a>
    </p>
  </div>
</section>
{% endblock %}
