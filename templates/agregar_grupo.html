<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=final1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
<div class="container">
  <header class="encabezado">
    <div class="logo-container">
      <img src="{{ url_for('static', filename='backgrounds/escudo.png') }}" alt="escudogrupo" class="logo">
    </div>
    <div class="titulo-container">
      <h1 class="titulo"><a href="/">PIOVERTADAS</a></h1>
    </div>
    <div class="logo-container">
    <a href="{{ url_for('agregar_grupo') }}">
  <img src="{{ url_for('static', filename='backgrounds/logopromesa.png') }}" alt="Registrar grupo" class="logo">
</a>

    </div>
  </header>
  <h1>¡AGREGA TU GRUPO!</h1>
<body style="font-family: sans-serif; background-color: #f1f1f1; padding: 20px;">
  <h1 style="text-align: center; color: #0077b6;">Agregar grupo</h1>
  <form method="POST" style="background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
    <label>Nombre:<br> <input type="text" name="nombre" required style="width: 100%; padding: 8px; margin-bottom: 10px;"></label><br>
    <label>Ciudad:<br> <input type="text" name="ciudad" required style="width: 100%; padding: 8px; margin-bottom: 10px;"></label><br>
    <label>Provincia:<br> <input type="text" name="provincia" required style="width: 100%; padding: 8px; margin-bottom: 10px;"></label><br>
    <label>Contacto:<br> <input type="text" name="contacto" required style="width: 100%; padding: 8px; margin-bottom: 10px;"></label><br>
    <button type="submit" style="background-color: #0077b6; color: #fff; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer;">Agregar</button>
  </form>
  <p style="text-align: center; margin-top: 20px;">
    <a href="{{ url_for('mostrar_grupos') }}" style="color: #0077b6; text-decoration: none;">⬅ Volver a la lista</a>
  </p>
</body>
