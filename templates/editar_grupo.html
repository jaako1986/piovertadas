{% extends "base.html" %}
{% block title %}Editar grupo — GSA Islas Malvinas{% endblock %}
{% block content %}
<section class="section container">
  <h1>Editar grupo</h1>
  <form method="post" style="display:grid;gap:.75rem;max-width:520px">
    <input name="nombre" value="{{ grupo.nombre }}" required>
    <input name="ciudad" value="{{ grupo.ciudad }}" required>
    <input name="provincia" value="{{ grupo.provincia }}" required>
    <input name="contacto" value="{{ grupo.contacto or '' }}">
    <button class="btn" type="submit">Guardar cambios</button>
  </form>
  <p style="margin-top:1rem">
    <a href="{{ url_for('ver_grupos') }}">⬅ Volver a la lista</a>
  </p>
</section>
{% endblock %}
