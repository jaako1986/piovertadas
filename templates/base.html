<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIOVERTADAS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home_v2.css') }}">
  <link rel="preload" href="{{ url_for('static', filename='fonts/WoodWorks-Plain.otf') }}" as="font" type="font/otf" crossorigin="anonymous">
</head>
<body>
  <!-- ==== HEADER ==== -->
  <header class="site-header">
    <div class="nav-container">
      <div class="brand">
        <img src="{{ url_for('static', filename='backgrounds/escudo.png') }}" alt="Logo Grupo" class="brand-logo">
        <span class="brand-text">PIOVERTADAS</span>
      </div>
      <nav class="nav-links">
        <a href="{{ url_for('home') }}">Inicio</a>
        <a href="{{ url_for('galeria') }}">Galería</a>
        <a href="{{ url_for('materiales') }}">Material</a>
+ <a href="{{ url_for('ver_grupos') }}">Grupos</a>

      </nav>
    </div>
  </header>

  <!-- ==== CONTENIDO PRINCIPAL ==== -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ==== FOOTER ==== -->
  <footer class="site-footer">
    <div class="footer-grid">
      <p>© {{ now().year }} Grupo Scouts Aeronavales “Islas Malvinas” Base VIII</p>
      <div class="footer-logos">
        <img src="{{ url_for('static', filename='backgrounds/logoASA.png') }}" alt="Logo ASA">
      </div>
    </div>
  </footer>
</body>
</html>
