<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <a class="brand" href="{{ url_for('home') }}">
  <img class="brand-logo" src="{{ url_for('static', filename='backgrounds/escudo.png') }}" alt="Escudo" />
  <span class="brand-text">PIOVERTADAS</span>
</a>

  <title>{% block title %}PIOVERTADAS{% endblock %}</title>

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- CSS principal (único) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home_v2.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
  <div class="container">
    <a class="brand" href="{{ url_for('home') }}">
      <img class="brand-logo" src="{{ url_for('static', filename='backgrounds/escudo.png') }}" alt="Escudo">
      <span class="brand-text">PIOVERTADAS</span>
    </a>

    <nav class="nav">
      <a class="{{ 'active' if request.path == url_for('home') else '' }}" href="{{ url_for('home') }}">Inicio</a>
      <a class="{{ 'active' if request.path.startswith('/galeria') else '' }}" href="{{ url_for('galeria') }}">Galería</a>
      <a class="{{ 'active' if request.path.startswith('/materiales') else '' }}" href="{{ url_for('materiales') }}">Materiales</a>
      <a class="{{ 'active' if request.path.startswith('/grupos') else '' }}" href="{{ url_for('ver_grupos') }}">Grupos</a>
    </nav>

    <!-- Logos a la derecha -->
    <div class="header-logos">
      <img class="logo-grupo" src="{{ url_for('static', filename='backgrounds/escudo.png') }}" alt="Escudo PIOVERTADAS">
      <img class="logo-asa"   src="{{ url_for('static', filename='backgrounds/logopromesa.png') }}" alt="ASA">
    </div>
  </div>
</header>


  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">© 2025 PIOVERTADAS — Patagonia</div>
  </footer>

  <script defer src="{{ url_for('static', filename='js/lazyload.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
